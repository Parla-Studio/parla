# Xcode project for the Parla iOS app, generated with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   xcodegen generate --spec project.yml
# scripts/build-ios.sh does this (and installs XcodeGen if needed). The .xcodeproj is not committed.
name: Parla
options:
  bundleIdPrefix: de.mirranet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    # Same version as the Android and desktop apps; the build number comes from Jenkins.
    MARKETING_VERSION: "1.3.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Builds are unsigned for now (simulator build + unsigned .ipa for sideloading).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""

packages:
  ParlaCore:
    path: ParlaCore

targets:
  Parla:
    type: application
    platform: iOS
    sources:
      - path: Parla
    dependencies:
      - package: ParlaCore
    info:
      path: Parla/Info.plist
      properties:
        CFBundleDisplayName: Parla
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Default server; can be changed on the login screen.
        ParlaServerURL: https://parla.mirranet.de
        # http:// is allowed so a server in the home network works; the login screen only accepts it for
        # local addresses (see isLocalAddress in LoginView.swift), servers on the internet need https://.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Parla verbindet sich mit deinem Parla-Server im lokalen Netzwerk.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mirranet.parla
        PRODUCT_NAME: Parla
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"

schemes:
  Parla:
    build:
      targets:
        Parla: all
