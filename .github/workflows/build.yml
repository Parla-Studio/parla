name: Build

# Builds the Android app (APK) and the Linux package of the desktop app; Windows and iOS are built by Jenkins.
# For a version tag (made by the Release workflow) both are published as a GitHub release, and the .deb also in the
# APT repository.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner has the Android SDK (ANDROID_HOME); missing platforms/build tools are installed by Gradle.
      - name: Release signing key
        # Optional: without these secrets the release APK is signed with the debug key of this run, and
        # installed apps cannot be updated with it (see README).
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "${ANDROID_KEYSTORE:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/parla-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/parla-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE not set; the APK is signed with a temporary debug key."
          fi
      - name: Test and build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: parla-android
          path: dist/*

  package:
    # Ubuntu 22.04: the package's dependencies then fit Debian 12 and Ubuntu 22.04+.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        working-directory: desktop
        run: |
          # jpackage builds the .deb with dpkg-deb and fakeroot.
          sudo apt-get update && sudo apt-get install -y fakeroot
          chmod +x gradlew
          ./gradlew --no-daemon distDeb
          mkdir -p ../dist
          cp build/dist/*.deb ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: parla-linux-x86_64
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: parla-*
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          cat > notes.md <<NOTES
          Parla ${version}

          | System | File |
          | --- | --- |
          | Android 8+ | \`Parla-${version}-release.apk\` |
          | Debian 12+, Ubuntu 22.04+ (x86_64) | \`Parla-${version}-linux.deb\` |

          Linux: install and update via apt.mirranet.de (package \`parla\`), see the README.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Parla ${version}" --notes-file notes.md

  apt:
    # Publish the release .deb to the MirraNET APT repository (apt.mirranet.de).
    # reprepro and the signing key live on the server; skipped when the deploy
    # secrets are not configured.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: parla-linux-*
          merge-multiple: true
      - name: Publish to APT repository
        env:
          APT_HOST: ${{ secrets.APT_HOST }}
          APT_SSH_KEY: ${{ secrets.APT_SSH_KEY }}
          APT_KNOWN_HOSTS: ${{ secrets.APT_KNOWN_HOSTS }}
          APT_REPO: ${{ secrets.APT_REPO }}
          APT_PORT: ${{ secrets.APT_PORT }}
          APT_SUITE: stable
        run: |
          if [ -z "${APT_HOST:-}" ]; then
            echo "::notice::APT deploy secrets not set; skipping APT publish."
            exit 0
          fi
          mkdir -p debs
          find dist -name '*.deb' -exec cp {} debs/ \;
          if ! ls debs/*.deb >/dev/null 2>&1; then echo "::error::no .deb found in artifacts"; exit 1; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$APT_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$APT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          opt="-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o Port=${APT_PORT:-22} -i $HOME/.ssh/id_deploy"
          tmp=$(ssh $opt "$APT_HOST" mktemp -d)
          scp $opt -q packaging/apt/publish.sh debs/*.deb "$APT_HOST:$tmp/"
          ssh $opt "$APT_HOST" bash -s -- "$tmp" "$APT_REPO" "$APT_SUITE" <<'EOF'
          rc=0
          bash "$1/publish.sh" "$2" "$3" "$1"/*.deb || rc=$?
          rm -rf "$1"
          exit $rc
          EOF
